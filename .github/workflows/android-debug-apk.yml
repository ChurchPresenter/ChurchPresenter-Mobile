name: Android Debug APK

# Manually triggered from the GitHub Actions tab, on any branch.
#
# Builds an UNSIGNED-for-release, debug-signed APK for putting a work-in-progress
# branch onto a real device. Deliberately debug rather than release:
#   • no R8 / resource shrinking, so new code is tested as written — a shrunk
#     build can fail in ways the source never would (reflection, serialization)
#   • Logger output reaches `adb logcat`, which matters when something is being
#     run on hardware for the first time
#   • needs only GOOGLE_SERVICES_JSON_BASE64, not the release keystore secrets
#
# For a signed, shippable build use "Android Release Build" (android-release.yml);
# for the Play internal-testing track use "Android Play Store" (android-play-store.yml).
#
# The APK is published as a GitHub **prerelease** rather than a workflow artifact,
# so testers can download it from the Releases page without a GitHub login and
# without hunting through run pages.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the commonTest suite before building
        required: true
        default: true
        type: boolean

# Opt into Node.js 24 now — Node.js 20 actions are deprecated (forced June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    # Publishing a release needs write access to repository contents.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The google-services plugin fails the build outright when the file is
      # absent, so check for the secret first and say so plainly.
      - name: Validate required secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "❌ GOOGLE_SERVICES_JSON_BASE64 is not set."
            echo "   The google-services Gradle plugin cannot build without it."
            echo ""
            echo "👉 See GITHUB_SECRETS_SETUP.md — encode with: base64 -b 0 -i google-services.json | pbcopy"
            echo "   Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Secret present."

      # tr -d strips CR/LF that macOS base64 embeds without -b 0.
      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GS_B64" | tr -d '\r\n' | base64 -d > composeApp/google-services.json
          test -s composeApp/google-services.json || {
            echo "❌ composeApp/google-services.json is empty after decode — the secret may be corrupted." >&2
            exit 1
          }

      # Cheap insurance: the suite is the only thing standing behind this build.
      - name: Run commonTest
        if: ${{ inputs.run_tests }}
        run: ./gradlew :composeApp:jsBrowserTest

      # Guards the standalone display page against remote dependencies — a hall
      # network often has no internet, so a CDN reference is a broken projector.
      - name: Check display assets are offline-capable
        run: bash scripts/check_display_assets_offline.sh

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      # Slashes are legal in git tags but awkward in filenames and URLs, so the
      # branch is flattened for both the tag and the asset name.
      - name: Name the release after the branch and commit
        id: naming
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHA7="${GITHUB_SHA::7}"
          echo "tag=debug-${BRANCH}-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "asset=churchpresenter-debug-${BRANCH}-${SHA7}.apk" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA7}" >> "$GITHUB_OUTPUT"

      # Globbed rather than hard-coded to composeApp-debug.apk so a future
      # rename in build.gradle.kts fails loudly here instead of shipping a
      # release with no asset attached.
      - name: Rename APK
        run: |
          shopt -s nullglob
          apks=(composeApp/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "❌ Expected exactly one debug APK, found ${#apks[@]}: ${apks[*]}" >&2
            exit 1
          fi
          mv "${apks[0]}" "composeApp/build/outputs/apk/debug/${{ steps.naming.outputs.asset }}"

      # `gh release create` fails if the tag already exists, so re-running the
      # workflow on the same commit deletes and recreates the prerelease. The
      # tag points at this commit either way.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.naming.outputs.tag }}
          ASSET: composeApp/build/outputs/apk/debug/${{ steps.naming.outputs.asset }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease $TAG already exists — replacing it."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # Built line by line rather than with a heredoc: every line of this
          # `run:` block is indented by YAML, and an indented heredoc terminator
          # never closes.
          {
            echo "Debug-signed APK built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA::7}\`."
            echo ""
            echo "Not for distribution — debug keystore, no R8 shrinking, logging enabled."
            echo ""
            echo '```bash'
            echo "adb install -r -g ${{ steps.naming.outputs.asset }}"
            echo '```'
            echo ""
            echo "Each CI run generates a fresh debug keystore, so \`-r\` fails with"
            echo "\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\` when replacing a build from a"
            echo "different run. Uninstall first — this also clears app data:"
            echo ""
            echo '```bash'
            echo "adb uninstall com.church.presenter.churchpresentermobile"
            echo '```'
          } > /tmp/release-notes.md

          gh release create "$TAG" "$ASSET" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug APK — ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
            --notes-file /tmp/release-notes.md

      - name: Summary
        run: |
          {
            echo "## Debug APK ready"
            echo ""
            echo "**Branch:** \`${GITHUB_REF_NAME}\`  "
            echo "**Commit:** \`${GITHUB_SHA::7}\`  "
            echo "**Prerelease:** [\`${{ steps.naming.outputs.tag }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.naming.outputs.tag }})"
            echo ""
            echo "### Install"
            echo '```bash'
            echo "gh release download ${{ steps.naming.outputs.tag }} --repo ${{ github.repository }}"
            echo "adb install -r -g ${{ steps.naming.outputs.asset }}"
            echo '```'
            echo ""
            echo "> Each CI run generates a fresh debug keystore, so \`-r\` fails with"
            echo "> \`INSTALL_FAILED_UPDATE_INCOMPATIBLE\` when replacing a build from a"
            echo "> different run. Uninstall first — this also clears app data:"
            echo '```bash'
            echo "adb uninstall com.church.presenter.churchpresentermobile"
            echo '```'
            echo ""
            echo "### Watch logs"
            echo '```bash'
            echo "adb logcat -s churchpresentermobile"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
