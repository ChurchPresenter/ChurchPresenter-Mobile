name: Store Release

# One button for both stores: builds a signed AAB and uploads it to Google
# Play, builds a signed IPA and uploads it to TestFlight — with the SAME
# version on each, decided once in the `version` job and handed to both.
#
# The number is derived, not committed. `main` only takes pull requests, so a
# workflow cannot push a "bump" commit to it — and neither store ever needed
# one, only a build number higher than the last upload. This run's number,
# plus an offset that continues the sequence the old bump commits reached,
# is exactly that: up by one per run, never repeated, identical on both
# platforms because both jobs read the same value.
#
# Either platform can be left out with its checkbox (a hotfix for one store,
# a rejected build on the other); the version still advances for both, so
# the two stay in step — a build number is never reused with different code.
#
# Required secrets — Android (see GITHUB_SECRETS_SETUP.md, PLAY_STORE.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON_BASE64,
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#
# Required secrets — iOS (see GITHUB_SECRETS_SETUP.md, APP_STORE.md):
#   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
#   IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID, IOS_CODE_SIGN_IDENTITY,
#   IOS_PROVISIONING_PROFILE_NAME, IOS_KEYCHAIN_PASSWORD,
#   GOOGLE_SERVICE_INFO_PLIST_BASE64, APP_STORE_CONNECT_KEY_ID,
#   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
#
# Optional: SENTRY_AUTH_TOKEN (iOS dSYM upload; skipped when unset).

on:
  workflow_dispatch:
    inputs:
      android:
        description: Upload to Google Play
        type: boolean
        default: true
      ios:
        description: Upload to TestFlight
        type: boolean
        default: true
      track:
        description: Play Store release track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout_percentage:
        description: "Production rollout % (only used when track = production)"
        required: false
        default: "20"

env:
  # Opt into Node.js 24 now — Node.js 20 actions are deprecated (forced June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Added to this workflow's run number to make the build number. A new
  # workflow file counts from 1, and the last uploads before it were Android
  # versionCode 21 and iOS build 20 — so 21 makes the first run here build 22
  # on both. Never lower this: a build number a store has already seen is
  # rejected, on Play as "version code already used".
  BUILD_NUMBER_OFFSET: 21

jobs:
  # ── The one version both platforms get ────────────────────────────────
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.compute.outputs.build }}
      name: ${{ steps.compute.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute the build number and version name
        id: compute
        run: |
          GRADLE="composeApp/build.gradle.kts"
          CONFIG="iosApp/Configuration/Config.xcconfig"

          # The checked-in values: what a local build gets, and the floor a
          # release must stay above.
          ANDROID_CODE=$(grep 'versionCode = ' "$GRADLE" | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          ANDROID_NAME=$(grep 'versionName = ' "$GRADLE" | sed 's/.*versionName = "\(.*\)".*/\1/')
          IOS_BUILD=$(grep '^CURRENT_PROJECT_VERSION=' "$CONFIG" | sed 's/CURRENT_PROJECT_VERSION=//')
          IOS_VERSION=$(grep '^MARKETING_VERSION=' "$CONFIG" | sed 's/MARKETING_VERSION=//')

          # major.minor is a human decision and lives in the files; both
          # platforms must agree on it or "the same version" means nothing.
          ANDROID_MM=$(echo "$ANDROID_NAME" | cut -d. -f1-2)
          IOS_MM=$(echo "$IOS_VERSION" | cut -d. -f1-2)
          if [ "$ANDROID_MM" != "$IOS_MM" ]; then
            echo "❌ versionName in $GRADLE ($ANDROID_NAME) and MARKETING_VERSION in $CONFIG ($IOS_VERSION)"
            echo "   disagree on major.minor. Make them match through a pull request, then re-run."
            exit 1
          fi

          BUILD=$(( BUILD_NUMBER_OFFSET + ${{ github.run_number }} ))
          NAME="${ANDROID_MM}.${BUILD}"

          if [ "$BUILD" -le "$ANDROID_CODE" ] || [ "$BUILD" -le "$IOS_BUILD" ]; then
            echo "❌ Build $BUILD is not above the checked-in versionCode ($ANDROID_CODE)"
            echo "   or CURRENT_PROJECT_VERSION ($IOS_BUILD); a store would reject it."
            echo "   Raise BUILD_NUMBER_OFFSET in this workflow past the larger of the two."
            exit 1
          fi

          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"   >> "$GITHUB_OUTPUT"
          echo "✅ Releasing ${NAME} (build ${BUILD}) — Android was ${ANDROID_NAME}/${ANDROID_CODE}, iOS ${IOS_VERSION}/${IOS_BUILD}"

  # ── Google Play ───────────────────────────────────────────────────────
  android:
    name: Build AAB & Upload to Play Store
    needs: version
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply the release version
        env:
          BUILD: ${{ needs.version.outputs.build }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          GRADLE="composeApp/build.gradle.kts"
          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD}/" "$GRADLE"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${NAME}\"/" "$GRADLE"
          grep -n 'versionCode = \|versionName = ' "$GRADLE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64:              ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD:               ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS:                    ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:                 ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64:          ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:     ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [ -z "$ANDROID_KEYSTORE_BASE64"          ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_STORE_PASSWORD"           ] && missing+=("ANDROID_STORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS"                ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD"             ] && missing+=("ANDROID_KEY_PASSWORD")
          [ -z "$GOOGLE_SERVICES_JSON_BASE64"      ] && missing+=("GOOGLE_SERVICES_JSON_BASE64")
          [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] && missing+=("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ The following required GitHub secrets are not set:"
            for s in "${missing[@]}"; do echo "   • $s"; done
            echo ""
            echo "👉 See PLAY_STORE.md Step 8 for service account setup instructions."
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Decode Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > /tmp/release.keystore
          test -s /tmp/release.keystore || {
            echo "❌ /tmp/release.keystore is empty after decode."
            echo "   Re-encode with: base64 -b 0 -i release.keystore | pbcopy"
            exit 1
          }

      - name: Create signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/signing
          cp /tmp/release.keystore /tmp/signing/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > /tmp/signing/signing.properties

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GS_B64" | tr -d '\r\n' | base64 -d > composeApp/google-services.json
          test -s composeApp/google-services.json || {
            echo "❌ google-services.json is empty after decode" >&2; exit 1
          }

      - name: Build release AAB
        run: ./gradlew :composeApp:bundleRelease
        env:
          SIGNING_REPO_PATH: /tmp/signing

      - name: Write Play Store service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > /tmp/play-service-account.json
          test -s /tmp/play-service-account.json || {
            echo "❌ Service account key is empty" >&2; exit 1
          }

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson:       /tmp/play-service-account.json
          packageName:              com.church.presenter.churchpresentermobile
          releaseFiles:             composeApp/build/outputs/bundle/release/*.aab
          track:                    ${{ inputs.track }}
          status:                   ${{ (inputs.track == 'production' && inputs.rollout_percentage != '100') && 'inProgress' || 'completed' }}
          userFraction:             ${{ inputs.track == 'production' && inputs.rollout_percentage != '100' && format('0.{0}', inputs.rollout_percentage) || '' }}
          inAppUpdatePriority:      2
          releaseName:              ${{ needs.version.outputs.name }}

      - name: Also upload AAB as artifact (for manual backup)
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab-${{ needs.version.outputs.build }}
          path: composeApp/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Google Play — ${{ needs.version.outputs.name }} (versionCode ${{ needs.version.outputs.build }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Track | \`${{ inputs.track }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`com.church.presenter.churchpresentermobile\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** Go to [Play Console](https://play.google.com/console) → Release → ${{ inputs.track }} to review and promote the release." >> $GITHUB_STEP_SUMMARY

  # ── TestFlight ────────────────────────────────────────────────────────
  ios:
    name: Build IPA & Upload to TestFlight
    needs: version
    if: ${{ inputs.ios }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply the release version
        env:
          BUILD: ${{ needs.version.outputs.build }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          CONFIG="iosApp/Configuration/Config.xcconfig"
          sed -i '' "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${BUILD}/" "$CONFIG"
          sed -i '' "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${NAME}/" "$CONFIG"
          grep -n 'CURRENT_PROJECT_VERSION\|MARKETING_VERSION' "$CONFIG"

      # iOS 26 SDK (Xcode 26) required for App Store Connect uploads from April 28 2026.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      - name: Install CocoaPods dependencies
        run: |
          cd iosApp
          pod install --repo-update

      - name: Validate required secrets
        env:
          IOS_CERTIFICATE_BASE64:           ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD:         ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64:  ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID:                      ${{ secrets.IOS_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY:           ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_NAME:    ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_KEYCHAIN_PASSWORD:            ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          APP_STORE_CONNECT_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID:      ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY:    ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "$IOS_CERTIFICATE_BASE64"           ] && missing+=("IOS_CERTIFICATE_BASE64")
          [ -z "$IOS_CERTIFICATE_PASSWORD"         ] && missing+=("IOS_CERTIFICATE_PASSWORD")
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64"  ] && missing+=("IOS_PROVISIONING_PROFILE_BASE64")
          [ -z "$IOS_TEAM_ID"                      ] && missing+=("IOS_TEAM_ID")
          [ -z "$IOS_CODE_SIGN_IDENTITY"           ] && missing+=("IOS_CODE_SIGN_IDENTITY")
          [ -z "$IOS_PROVISIONING_PROFILE_NAME"    ] && missing+=("IOS_PROVISIONING_PROFILE_NAME")
          [ -z "$IOS_KEYCHAIN_PASSWORD"            ] && missing+=("IOS_KEYCHAIN_PASSWORD")
          [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ] && missing+=("GOOGLE_SERVICE_INFO_PLIST_BASE64")
          [ -z "$APP_STORE_CONNECT_KEY_ID"         ] && missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -z "$APP_STORE_CONNECT_ISSUER_ID"      ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -z "$APP_STORE_CONNECT_PRIVATE_KEY"    ] && missing+=("APP_STORE_CONNECT_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ The following required GitHub secrets are not set:"
            for s in "${missing[@]}"; do echo "   • $s"; done
            echo ""
            echo "👉 See APP_STORE.md Step 9 for API key setup instructions."
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Import Apple Distribution certificate
        env:
          CERT_B64:             ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:    ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$CERT_B64" | tr -d '\r\n' | base64 -d > "$CERT_PATH"
          test -s "$CERT_PATH" || {
            echo "❌ $CERT_PATH is empty after decode."
            echo "   Re-encode with: base64 -b 0 -i distribution.p12 | pbcopy"
            exit 1
          }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PP_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build.mobileprovision
          echo "$PP_B64" | tr -d '\r\n' | base64 -d > "$PP_PATH"
          test -s "$PP_PATH" || { echo "❌ $PP_PATH is empty after decode" >&2; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" /dev/stdin \
            <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "Installed provisioning profile: $UUID"

      - name: Write Signing.xcconfig
        env:
          IOS_TEAM_ID:                   ${{ secrets.IOS_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY:        ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > iosApp/Configuration/Signing.xcconfig << XCEOF
          TEAM_ID = ${IOS_TEAM_ID}
          CODE_SIGN_IDENTITY = ${IOS_CODE_SIGN_IDENTITY}
          CODE_SIGN_STYLE = Manual
          PROVISIONING_PROFILE_SPECIFIER = ${IOS_PROVISIONING_PROFILE_NAME}
          PRODUCT_BUNDLE_IDENTIFIER = com.church.presenter.churchpresentermobile
          APS_ENVIRONMENT = production
          XCEOF

      - name: Decode GoogleService-Info.plist
        env:
          GSINFO_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GSINFO_B64" | tr -d '\r\n' | base64 -d > iosApp/iosApp/GoogleService-Info.plist
          test -s iosApp/iosApp/GoogleService-Info.plist || {
            echo "❌ iosApp/iosApp/GoogleService-Info.plist is empty after decode" >&2
            exit 1
          }

      - name: Archive iOS app
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="${{ secrets.IOS_CODE_SIGN_IDENTITY }}" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty || {
              echo "══════════════════════════════════════════"
              echo "xcpretty failed — full raw xcodebuild log:"
              echo "══════════════════════════════════════════"
              cat /tmp/xcodebuild.log
              exit 1
            }

      - name: Write ExportOptions.plist
        run: |
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store" \
            -c "Add :teamID string ${{ secrets.IOS_TEAM_ID }}" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string ${{ secrets.IOS_CODE_SIGN_IDENTITY }}" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.church.presenter.churchpresentermobile string ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/output" \
            | xcpretty

      # altool discovers the .p8 key automatically when placed in ~/.private_keys/
      # named AuthKey_<KEY_ID>.p8 — no --private-key-path flag needed.
      - name: Upload to TestFlight
        env:
          KEY_ID:      ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8

          IPA_PATH=$(find "$RUNNER_TEMP/output" -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey  "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --show-progress

          rm -rf ~/.private_keys

      - name: Save IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa-${{ needs.version.outputs.build }}
          path: ${{ runner.temp }}/output/*.ipa
          retention-days: 14

      # Sentry cannot symbolicate a native iOS crash without the dSYMs — every
      # app frame arrives as a bare address, and the "culprit" it shows is just
      # the nearest exported symbol, which is usually misleading. Uploading here
      # is what makes an EXC_BAD_ACCESS report actionable.
      #
      # Skips (does not fail) when SENTRY_AUTH_TOKEN is unset, so the build keeps
      # working until the secret is added. The dSYMs are also saved as an
      # artifact, so they can be uploaded by hand from any past run.
      - name: Upload dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: church-projector
          SENTRY_PROJECT: church-presenter-mobile
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "⚠️  SENTRY_AUTH_TOKEN is not set — skipping dSYM upload."
            echo "   iOS crashes will stay unsymbolicated in Sentry until it is."
            echo "   Create a token with project:releases scope at"
            echo "   https://church-projector.sentry.io/settings/auth-tokens/"
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload "$RUNNER_TEMP/iosApp.xcarchive/dSYMs"

      - name: Save dSYMs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: testflight-dsyms-${{ needs.version.outputs.build }}
          path: ${{ runner.temp }}/iosApp.xcarchive/dSYMs
          retention-days: 14

      - name: Summary
        run: |
          echo "## ✅ TestFlight — ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.build }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build appears in App Store Connect → TestFlight once Apple has processed it, usually within 5–15 minutes." >> $GITHUB_STEP_SUMMARY

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
