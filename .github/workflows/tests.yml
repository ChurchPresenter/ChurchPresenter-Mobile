name: Tests

# Runs the shared commonTest suite on every push/PR.
#  - offline-assets: guards the bundled display page against remote dependencies.
#  - js-tests:  fast, headless-browser run of all commonTest — no secrets needed.
#  - coverage:  Kover coverage over the Android unit-test variant (logic layer),
#               needs GOOGLE_SERVICES_JSON_BASE64 to configure the Android build.

on:
  push:
    branches: [ main ]
  pull_request:

# Opt into Node.js 24 now — Node.js 20 actions are deprecated (forced June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  offline-assets:
    name: display assets are offline-capable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled display page has no remote dependencies
        run: bash scripts/check_display_assets_offline.sh

  js-tests:
    name: commonTest (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run commonTest (jsBrowserTest)
        run: ./gradlew :composeApp:jsBrowserTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-report
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  coverage:
    name: Coverage (Kover, model+network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set — skipping coverage job."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$GS_B64" | tr -d '\r\n' | base64 -d > composeApp/google-services.json
          test -s composeApp/google-services.json || { echo "ERROR: google-services.json empty after decode" >&2; exit 1; }
      - name: Generate + verify coverage (gates on the 80% floor)
        if: env.SKIP != '1'
        # --continue so the HTML/XML report is still produced even when koverVerify
        # fails the build, so the uploaded artifact shows what dropped below the floor.
        run: ./gradlew :composeApp:koverXmlReport :composeApp:koverHtmlReport :composeApp:koverVerify --continue
      - name: Upload coverage report
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: composeApp/build/reports/kover/
          if-no-files-found: ignore
