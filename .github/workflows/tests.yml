name: Tests

# Runs the shared commonTest suite on every push/PR.
#  - offline-assets: guards the bundled display page against remote dependencies.
#  - detekt:    static analysis on the desktop app's ruleset — seconds, no secrets.
#  - js-tests:  fast, headless-browser run of all commonTest — no secrets needed.
#  - coverage:  JaCoCo coverage over the Android unit-test variant, gated on the
#               floors in composeApp/build.gradle.kts. Runs with or without
#               GOOGLE_SERVICES_JSON_BASE64 — the build writes a Firebase
#               placeholder when the secret is absent, as it does for a fresh
#               clone, so a fork's PR is gated exactly like anyone else's.
#  - screenshots: Roborazzi golden images. FAILS the build on any visual change
#               that is not in the committed goldens, so a branch cannot merge
#               with an unreviewed one.

on:
  push:
    branches: [ main ]
  pull_request:
  # Manual "record" run — see the screenshots job. Goldens are tied to the OS
  # that drew them, so they have to be produced on a runner, not a laptop.
  workflow_dispatch:
    inputs:
      record:
        description: "Re-record the screenshot goldens on Linux and upload them as an artifact"
        type: boolean
        default: false

# Opt into Node.js 24 now — Node.js 20 actions are deprecated (forced June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  offline-assets:
    name: display assets are offline-capable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled display page has no remote dependencies
        run: bash scripts/check_display_assets_offline.sh

  detekt:
    name: Detekt (desktop ruleset)
    runs-on: ubuntu-latest
    # ~10s, and it runs alongside the suite rather than after it, so a style
    # regression is reported without waiting on the browser tests.
    #
    # Pre-existing findings are baselined in config/detekt/baseline.xml, so this
    # gate fails only on findings the change itself introduced. No secrets: detekt
    # parses source and never needs the Firebase config the coverage job decodes.
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew :composeApp:detekt
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: composeApp/build/reports/detekt/
          if-no-files-found: ignore

  js-tests:
    name: commonTest (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run commonTest (jsBrowserTest)
        run: ./gradlew :composeApp:jsBrowserTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-report
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  # Golden-image tests. A visual change that is not in the committed goldens
  # fails this job, and with the check required on the branch it stops the merge
  # — which is the point: a screenshot suite nobody has to look at is a folder
  # of PNGs, not a test.
  #
  # Why this runs on ubuntu and nowhere else: a golden is a byte-for-byte
  # comparison, and text does not rasterise identically across operating
  # systems. The committed images are therefore whatever THIS runner draws, and
  # a laptop cannot produce a comparable one. Hence the record path below,
  # rather than "run it locally with -Precord and commit what you get".
  screenshots:
    name: Screenshots (Roborazzi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The gate. No -Precord, so Roborazzi compares against the committed
      # goldens and fails on the first one that differs.
      - name: Verify screenshots
        if: ${{ !inputs.record }}
        run: ./gradlew :composeApp:screenshotTest

      # What changed, as pictures: <name>_actual.png and a side-by-side
      # <name>_compare.png per failure. Without these the failure is a file name
      # and a reviewer has no way to tell a regression from an intended redesign.
      - name: Upload diffs
        if: ${{ failure() && !inputs.record }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: composeApp/build/outputs/roborazzi/
          if-no-files-found: ignore

      # The record path, run by hand from the Actions tab when a change is
      # MEANT to move the pixels: it redraws every golden on this runner and
      # uploads them. Download, unzip over composeApp/screenshots/, commit, and
      # the gate goes green on the new images — which is also the moment a
      # reviewer sees the redesign in the diff.
      #
      # Deliberately NOT a push back to the branch: goldens are the thing being
      # reviewed, and a bot commit that lands them unread defeats the suite.
      - name: Record screenshots
        if: ${{ inputs.record }}
        run: ./gradlew :composeApp:screenshotTest -Precord
      - name: Upload recorded goldens
        if: ${{ inputs.record }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: composeApp/screenshots/
          if-no-files-found: error

  coverage:
    name: Coverage (JaCoCo)
    runs-on: ubuntu-latest
    # pull-requests: write for the coverage comment below; everything else this job
    # does needs no more than the read the default token already carries.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        # No secret is not a reason to skip the gate. The build writes a valid
        # placeholder when the file is missing (see build.gradle.kts), which is
        # all the Android unit-test variant needs — and secrets are unavailable
        # to pull requests from forks, so skipping here let exactly the PRs
        # nobody has reviewed yet through without a coverage check at all.
        run: |
          if [ -z "$GS_B64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 not set — the build will write its placeholder."
            exit 0
          fi
          echo "$GS_B64" | tr -d '\r\n' | base64 -d > composeApp/google-services.json
          test -s composeApp/google-services.json || { echo "ERROR: google-services.json empty after decode" >&2; exit 1; }
      - name: Generate + verify coverage (fails below the floors)
        # --continue so the HTML/XML report is still produced even when the
        # verification fails, so the uploaded artifact shows what dropped below the floor.
        #
        # -PstepSummary rather than letting the task read GITHUB_STEP_SUMMARY itself: that
        # variable is a fresh per-step file, while the Gradle daemon's environment is frozen
        # at the moment it started — possibly during an earlier step whose summary file the
        # runner has already discarded. A -P property travels with this invocation, so the
        # coverage block lands on the summary page of the run a reviewer actually opens.
        run: >-
          ./gradlew :composeApp:jacocoTestReport :composeApp:jacocoTestCoverageVerification
          -PstepSummary="$GITHUB_STEP_SUMMARY" --continue
      # Every counter, its floor, and the figure this run measured, as one comment on
      # the pull request — the same table the desktop app posts, read from the same
      # JaCoCo XML and the same FLOOR csv. Nothing else in CI reports a number: the
      # floors only speak up when they are breached, so a change could move coverage
      # several points in either direction and say nothing at all.
      #
      # Never gates. The `jacocoTestCoverageVerification` step above is the real
      # floor; a counter under its cap is marked here and nowhere enforced.
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request'
        # A pull request from a fork gets a read-only token, so the comment cannot be
        # posted there however the job is configured. The numbers are still on the run
        # summary and in the uploaded report, and the gate above has already had its
        # say — failing this job over a comment a fork is not allowed to write would
        # gate outside contributors on a permission they cannot be given.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ./gradlew :composeApp:coverageFloors -q > floors.csv || true
          python3 - <<'PY' > coverage.md
          import os, xml.etree.ElementTree as ET

          # JaCoCo's own column order, so the table reads like the HTML overview.
          COUNTERS = ["INSTRUCTION", "BRANCH", "LINE", "COMPLEXITY", "METHOD", "CLASS"]
          REPORT = "composeApp/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"

          # The floors as the verification task itself has them, so the cap reported is
          # the cap enforced. CSV: FLOOR,<module>,<counter>,<minimum>
          floors = {}
          if os.path.exists("floors.csv"):
              for line in open("floors.csv"):
                  parts = line.strip().split(",")
                  if len(parts) == 4 and parts[0] == "FLOOR":
                      floors[parts[2]] = float(parts[3]) * 100

          # Report-wide totals are the <counter> elements on the root <report>.
          ratios = {}
          if os.path.exists(REPORT):
              root = ET.parse(REPORT).getroot()
              for c in root.findall("counter"):
                  missed, covered = int(c.get("missed")), int(c.get("covered"))
                  total = missed + covered
                  if total:
                      ratios[c.get("type")] = (100 * covered / total, covered, total)

          def gap(counter):
              floor = floors.get(counter)
              if floor is None or counter not in ratios:
                  return None
              short = floor - ratios[counter][0]
              return short if short > 0 else None

          breached = [c for c in COUNTERS if gap(c) is not None]

          print("<!-- coverage-table -->")
          print("## Coverage")
          print()
          if not ratios:
              print("No JaCoCo report was produced in this run — see the job log.")
          else:
              if breached:
                  print(f":warning: **{len(breached)} counter(s) below floor.**")
                  print()
              print("| Counter | Floor | Actual | Covered |")
              print("|---|---|---|---|")
              for counter in COUNTERS:
                  if counter not in ratios:
                      continue
                  pct, covered, total = ratios[counter]
                  floor = floors.get(counter)
                  cap = "" if floor is None else f"{floor:.1f}%"
                  short = gap(counter)
                  mark = "" if short is None else f" :warning: -{short:.2f}pt"
                  print(f"| {counter.title()} | {cap} | {pct:.2f}%{mark} | {covered}/{total} |")
              print()
              print("Measured over the whole module on the Android unit-test and JVM runs.")
              print("The floors are enforced by the `jacocoTestCoverageVerification` step, not by this table.")
          PY

          # Upsert: one comment per pull request, found by the marker on its first line.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- coverage-table -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -F body=@coverage.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@coverage.md >/dev/null
          fi
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: composeApp/build/reports/jacoco/
          if-no-files-found: ignore
